# Copy to the consuming repository's .github/workflows/ directory.
# Configure LOCKFILE_MAINTENANCE_TOKEN as a GitHub App token or fine-grained PAT
# with contents and pull-requests write access to run PR CI without GITHUB_TOKEN's approval gate.
# The Action updates Cargo.lock and creates or updates a maintenance PR.
# It installs a pinned nightly Cargo via rustup if absent, without changing the default toolchain.
# Cargo may downgrade a recently locked version to meet the age policy.
# Git dependencies and registry entries without pubtime are not age-checked.
# Named registries can override the global age through their own Cargo configuration.
name: Lockfile maintenance

on: # zizmor: ignore[dangerous-triggers] -- PR events only validate and dispatch; no PR checkout or execution.
  schedule:
    - cron: '17 0 * * 5' # Friday 09:17 JST
  workflow_dispatch:
    inputs:
      request-comment:
        description: Rebase request comment ID (set by the request job).
        type: string
        default: ''
      request-pull-request:
        description: Rebase request PR number (set by the request job).
        type: string
        default: ''
  issue_comment:
    types: [created]
  pull_request_target:
    types: [edited]

permissions:
  contents: read

jobs:
  request-rebase:
    if: github.event_name == 'issue_comment' || github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      issues: write
      pull-requests: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: knu/lockfile-maintenance-action/request-rebase@v1 # zizmor: ignore[unpinned-uses] -- Follow the tested v1 release series.

  update:
    permissions:
      issues: write
      contents: write
      pull-requests: write
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref_name == github.event.repository.default_branch
    concurrency:
      group: lockfile-maintenance
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Update dependencies
        id: maintenance
        uses: knu/lockfile-maintenance-action@v1 # zizmor: ignore[unpinned-uses] -- Follow the v1 release series in this example.
        with:
          files: /Cargo.lock
          minimum-release-age: 3 days
          token: ${{ secrets.LOCKFILE_MAINTENANCE_TOKEN }}
          request-comment: ${{ inputs.request-comment }}
          request-pull-request: ${{ inputs.request-pull-request }}
