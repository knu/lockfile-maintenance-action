name: Lockfile maintenance

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 * * 5' # Friday 09:00 JST

permissions:
  contents: read

jobs:
  maintain:
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: lockfile-maintenance
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: knu/lockfile-maintenance-action@v2 # zizmor: ignore[unpinned-uses] -- Follow the tested v2 release series.
        with:
          files: /package-lock.json
          minimum-release-age: 3 days
