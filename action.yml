name: Lockfile maintenance
description: Update selected lockfiles with native minimum release ages and create a pull request.
author: Akinori MUSHA
branding:
  icon: refresh-cw
  color: green

inputs:
  setup-yarn:
    description: Automatically prepare Yarn for selected lockfiles. Set to false to use a manually installed Yarn.
    default: 'true'
  setup-uv:
    description: Automatically prepare uv when uv.lock is selected.
    default: 'true'
  uv-version:
    description: uv version to install during automatic setup.
    default: '0.12.17'
  setup-bundler:
    description: Automatically prepare Ruby and Bundler when Gemfile.lock is selected.
    default: 'true'
  ruby-version:
    description: Ruby version for automatic Bundler setup. Use separate invocations for projects requiring different Ruby versions.
    default: '4.0'
  bundler-version:
    description: Bundler version to install during automatic setup. Requires >=4.0.18.
    default: '4.0.21'
  setup-rustup:
    description: Install rustup when Cargo.lock is selected and rustup is unavailable.
    default: 'true'
  setup-pnpm:
    description: Automatically prepare pnpm for selected lockfiles. Set to false to use a manually installed pnpm.
    default: 'true'
  request-comment:
    description: Rebase request comment ID forwarded from workflow_dispatch inputs.
    default: ''
  request-pull-request:
    description: Rebase request PR number forwarded from workflow_dispatch inputs.
    default: ''
  reaction-token:
    description: Token for rebase completion reactions. Requires issues write permission.
    default: ${{ github.token }}
  create-pull-request:
    description: Create or update a PR. Set to false to only update files in the checkout.
    default: 'true'
  auth:
    description: Authentication mode (token or oidc). OIDC requires id-token write permission and broker authorization.
    default: oidc
  token:
    description: Token for checkout and PR creation. Requires contents read access, plus contents and pull-requests write access for PR creation.
    default: ${{ github.token }}
  author:
    description: 'Commit author in the format Name <email@example.com>.'
    default: 'lockfile-maintenance[bot] <331761537+lockfile-maintenance[bot]@users.noreply.github.com>'
  committer:
    description: 'Commit committer in the format Name <email@example.com>.'
    default: 'lockfile-maintenance[bot] <331761537+lockfile-maintenance[bot]@users.noreply.github.com>'
  branch:
    description: Branch for the maintenance PR. Use a different branch for each independent file selection.
    default: automation/lockfile-maintenance
  base:
    description: Target branch for the PR and automatic checkout. An existing checkout is preserved.
    default: ${{ github.event.repository.default_branch }}
  labels:
    description: Comma or newline-separated labels for the PR.
    default: dependencies
  files:
    description: >-
      Newline-separated gitignore-style patterns relative to working-directory.
      Positive patterns include lockfiles; ! excludes; the last matching line wins.
      Supports *, **, / anchors, directory patterns, # comments, and backslash escapes.
      Only Git-tracked files with supported lockfile names are considered.
      By default, selects all supported Git-tracked lockfiles, including subdirectories.
      Symlinks are not followed.
      Matching no lockfiles is an error. Requires npm >=11.10; pnpm, Yarn, uv, and Bundler
      are prepared automatically; Cargo installs a pinned nightly.
    default: |
      Cargo.lock
      package-lock.json
      pnpm-lock.yaml
      yarn.lock
      uv.lock
      Gemfile.lock
  minimum-release-age:
    description: >-
      Positive integer and plural unit (seconds, minutes, hours, days, weeks, months).
      Months mean 30 days. Rounded up to minutes for pnpm/Yarn and days for Bundler.
      Passed to native resolvers; their source/package exceptions and missing-timestamp
      behavior still apply. Git dependencies are not age-checked.
    default: 3 days
  release-history-layout:
    description: Release history layout. Separate collapsible sections (separate), or collapsible rows inside each table (inline).
    default: separate
  working-directory:
    description: Root for file patterns, relative to the checkout.
    default: .

outputs:
  pull-request-number:
    description: Number of the maintenance PR, or empty when none exists or PR creation is disabled.
    value: ${{ steps.pull-request.outputs.pull-request-number }}
  pull-request-url:
    description: URL of the maintenance PR, or empty when none exists or PR creation is disabled.
    value: ${{ steps.pull-request.outputs.pull-request-url }}
  changed:
    description: Whether any selected lockfile changed (true or false).
    value: ${{ steps.maintenance.outputs.changed }}
  lockfiles:
    description: JSON array of selected lockfile paths relative to the checkout.
    value: ${{ steps.maintenance.outputs.lockfiles }}
  changed-lockfiles:
    description: JSON array of changed lockfile paths relative to the checkout.
    value: ${{ steps.maintenance.outputs.changed-lockfiles }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24'
        package-manager-cache: false

    - name: Prepare Action runtime
      id: runtime
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: node "$ACTION_PATH/scripts/setup.js"

    - name: Cache Action dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/lockfile-maintenance-npm-cache
        key: lockfile-maintenance-npm-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.lock-hash }}

    - name: Install Action dependencies
      shell: bash
      env:
        ACTION_DIRECTORY: ${{ steps.runtime.outputs.directory }}
        NPM_CONFIG_CACHE: ${{ runner.temp }}/lockfile-maintenance-npm-cache
      run: npm ci --prefix "$ACTION_DIRECTORY" --omit=dev --ignore-scripts --no-audit --no-fund --prefer-offline

    - name: Authenticate
      id: authentication
      shell: bash
      env:
        ACTION_DIRECTORY: ${{ steps.runtime.outputs.directory }}
        INPUT_AUTH: ${{ inputs.auth }}
        INPUT_TOKEN: ${{ inputs.token }}
      run: node "$ACTION_DIRECTORY/src/authenticate.js"

    - name: Check for an existing checkout
      id: checkout
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: node "$ACTION_PATH/scripts/checkout.js"

    - name: Check out the target repository
      if: steps.checkout.outputs.required == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.base }}
        token: ${{ steps.authentication.outputs.token }}
        persist-credentials: false

    - name: Detect required tools
      id: tools
      shell: bash
      env:
        ACTION_DIRECTORY: ${{ steps.runtime.outputs.directory }}
        INPUT_FILES: ${{ inputs.files }}
        INPUT_MINIMUM-RELEASE-AGE: ${{ inputs.minimum-release-age }}
        INPUT_WORKING-DIRECTORY: ${{ inputs.working-directory }}
      run: node "$ACTION_DIRECTORY/src/setup-tools.js"

    - name: Set up uv
      if: steps.tools.outputs.uv == 'true' && inputs.setup-uv == 'true'
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: ${{ inputs.uv-version }}
        enable-cache: false

    - name: Set up Ruby and Bundler
      if: steps.tools.outputs.bundler == 'true' && inputs.setup-bundler == 'true'
      uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
      with:
        ruby-version: ${{ inputs.ruby-version }}
        bundler: ${{ inputs.bundler-version }}
        bundler-cache: false

    - name: Set up rustup
      if: steps.tools.outputs.rustup == 'true' && inputs.setup-rustup == 'true'
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      env:
        RUSTUP_TOOLCHAIN: ${{ steps.tools.outputs.cargo-toolchain }}
      with:
        toolchain: ${{ steps.tools.outputs.cargo-toolchain }}
        cache: false
        matcher: false
        override: false

    - name: Update lockfiles
      id: maintenance
      shell: bash
      env:
        ACTION_DIRECTORY: ${{ steps.runtime.outputs.directory }}
        INPUT_SETUP_YARN: ${{ inputs.setup-yarn }}
        INPUT_SETUP_PNPM: ${{ inputs.setup-pnpm }}
        INPUT_FILES: ${{ inputs.files }}
        INPUT_MINIMUM-RELEASE-AGE: ${{ inputs.minimum-release-age }}
        INPUT_WORKING-DIRECTORY: ${{ inputs.working-directory }}
        INPUT_CREATE_PULL_REQUEST: ${{ inputs.create-pull-request }}
        INPUT_RELEASE_HISTORY_LAYOUT: ${{ inputs.release-history-layout }}
        INPUT_AUTH: ${{ inputs.auth }}
        INPUT_TOKEN: ${{ steps.authentication.outputs.token }}
        LOCKFILE_REPORT_PATH: ${{ steps.runtime.outputs.directory }}/pull-request.md
        INPUT_BRANCH: ${{ inputs.branch }}
        INPUT_BASE: ${{ inputs.base }}
      run: node "$ACTION_DIRECTORY/src/main.js"

    - name: Create or update pull request
      id: pull-request
      if: inputs.create-pull-request == 'true'
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        token: ${{ steps.authentication.outputs.token }}
        branch: ${{ inputs.branch }}
        author: ${{ inputs.author }}
        committer: ${{ inputs.committer }}
        base: ${{ inputs.base }}
        labels: ${{ inputs.labels }}
        add-paths: ${{ steps.maintenance.outputs.pr-paths }}
        commit-message: Maintain lockfiles with a minimum release age
        title: Lockfile maintenance
        body-path: ${{ steps.runtime.outputs.directory }}/pull-request.md
        delete-branch: true

    - name: Report rebase result
      if: always() && inputs.request-comment != ''
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_TOKEN: ${{ inputs.reaction-token }}
        INPUT_REQUEST_COMMENT: ${{ inputs.request-comment }}
        INPUT_REQUEST_PULL_REQUEST: ${{ inputs.request-pull-request }}
        UPDATE_OUTCOME: ${{ steps.pull-request.outcome }}
        UPDATED_PULL_REQUEST: ${{ steps.pull-request.outputs.pull-request-number }}
      run: node "$ACTION_PATH/src/finish-rebase.js"

    - name: Revoke OIDC installation token
      if: always() && inputs.auth == 'oidc' && steps.authentication.outputs.token != ''
      shell: bash
      env:
        ACTION_DIRECTORY: ${{ steps.runtime.outputs.directory }}
        INSTALLATION_TOKEN: ${{ steps.authentication.outputs.token }}
      run: node "$ACTION_DIRECTORY/src/revoke-token.js"

    - name: Remove Action runtime
      if: always() && steps.runtime.outputs.directory != ''
      shell: bash
      env:
        ACTION_DIRECTORY: ${{ steps.runtime.outputs.directory }}
      run: rm -rf -- "$ACTION_DIRECTORY"
